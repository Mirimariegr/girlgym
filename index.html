<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GirlGym</title>
<meta name="theme-color" content="#FF5FA2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GirlGym">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#FF5FA2; --pink-d:#E23D87; --pink-l:#FFE3F0; --pink-xl:#FFF4F9;
  --lila:#B794FF; --lila-l:#F1E9FF; --peach:#FFC9A8; --mint:#9EE6C9; --mint-d:#2E9E73;
  --gold:#FFC94D; --ink:#3A2440; --ink-2:#6E5577; --ink-3:#A891AE; --line:#F6D5E5;
  --white:#fff; --r:22px; --shadow:0 8px 24px rgba(226,61,135,.12);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,#FFF0F7 0%,#FBF3FF 60%,#FFF6F0 100%);background-attachment:fixed;-webkit-font-smoothing:antialiased;padding-bottom:110px}
h1,h2,h3,.f{font-family:'Fredoka',sans-serif;font-weight:600;letter-spacing:-.01em}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:inherit}
.wrap{max-width:520px;margin:0 auto;padding:18px 16px}
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 14px}
.top h1{font-size:26px}
.top .sub{color:var(--ink-2);font-size:14px;font-weight:600}
.chip-xp{background:var(--white);border-radius:99px;padding:6px 12px;font-weight:800;font-size:13px;box-shadow:var(--shadow);color:var(--pink-d);white-space:nowrap}
.card{background:var(--white);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.card.hero{background:linear-gradient(135deg,#FF7DB4 0%,#C49BFF 100%);color:#fff}
.card.soft{background:var(--pink-xl);box-shadow:none;border:2px dashed var(--line)}
.card h2{font-size:20px;margin-bottom:4px}
.card h3{font-size:16px;margin-bottom:6px}
.muted{color:var(--ink-2);font-size:14px}
.tiny{font-size:12px;color:var(--ink-3);font-weight:700}
.hero .muted,.hero .tiny{color:rgba(255,255,255,.9)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px 18px;border-radius:18px;background:var(--pink);color:#fff;font-family:'Fredoka';font-weight:600;font-size:18px;box-shadow:0 6px 0 var(--pink-d);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 var(--pink-d)}
.btn.white{background:#fff;color:var(--pink-d);box-shadow:0 6px 0 rgba(0,0,0,.08)}
.btn.lila{background:var(--lila);box-shadow:0 6px 0 #9670E8}
.btn.ghost{background:var(--pink-l);color:var(--pink-d);box-shadow:none}
.btn.sm{padding:10px 14px;font-size:15px;width:auto;border-radius:14px}
.btn.mint{background:var(--mint-d);box-shadow:0 6px 0 #1f7a57}
.link{color:var(--pink-d);font-weight:800;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.mt{margin-top:12px}.mt2{margin-top:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

/* week dots */
.week{display:flex;justify-content:space-between;gap:4px;margin-top:6px}
.wd{flex:1;text-align:center;font-weight:800;font-size:13px;color:var(--ink-3)}
.wd .dot{width:36px;height:36px;margin:4px auto 0;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#F7EEF3;font-size:16px}
.wd.plan .dot{background:var(--pink-l);border:2px dashed var(--pink)}
.wd.done .dot{background:var(--pink);color:#fff;border:0}
.wd.today{color:var(--pink-d)}

/* progress */
.bar{height:14px;border-radius:99px;background:rgba(0,0,0,.07);overflow:hidden}
.hero .bar{background:rgba(255,255,255,.35)}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--pink),var(--lila));transition:width .6s}
.hero .bar>i{background:#fff}

/* nav */
nav.bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:calc(100% - 28px);max-width:490px;background:#fff;border-radius:26px;display:flex;justify-content:space-around;padding:8px;box-shadow:0 10px 30px rgba(120,40,90,.18);z-index:20}
nav.bottom button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:18px;font-size:12px;font-weight:800;color:var(--ink-3)}
nav.bottom button .ic{font-size:22px;filter:grayscale(.7);opacity:.7}
nav.bottom button.on{background:var(--pink-l);color:var(--pink-d)}
nav.bottom button.on .ic{filter:none;opacity:1}

/* list items */
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1.5px solid #FBEAF2}
.item:last-child{border-bottom:0}
.emo{width:42px;height:42px;border-radius:14px;background:var(--pink-xl);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.grow{flex:1;min-width:0}
.name{font-weight:800}
.x{width:34px;height:34px;border-radius:12px;background:#F8EFF4;color:var(--ink-3);font-weight:800;flex-shrink:0}
.pill{display:inline-flex;align-items:center;gap:4px;background:var(--lila-l);color:#7A4FD6;font-weight:800;font-size:12px;padding:4px 10px;border-radius:99px}
.pill.pk{background:var(--pink-l);color:var(--pink-d)}
.pill.mn{background:#DDF7EC;color:var(--mint-d)}

/* day chips */
.days{display:flex;gap:6px;justify-content:space-between}
.day{flex:1;aspect-ratio:1;max-width:52px;border-radius:16px;background:#fff;border:2px solid var(--line);font-weight:800;font-family:'Fredoka';font-size:17px;color:var(--ink-2)}
.day.on{background:var(--pink);border-color:var(--pink);color:#fff;box-shadow:0 4px 0 var(--pink-d)}

/* stepper */
.stp{display:flex;align-items:center;background:#FFF6FA;border-radius:14px;border:1.5px solid var(--line);overflow:hidden}
.stp button{width:34px;height:42px;font-size:20px;font-weight:800;color:var(--pink-d)}
.stp input{width:100%;min-width:0;text-align:center;border:0;background:transparent;font-weight:800;font-size:17px;height:42px;outline:none}
.stp .u{font-size:11px;color:var(--ink-3);font-weight:800;padding-right:4px}

/* workout */
.wohead{position:sticky;top:0;z-index:15;background:linear-gradient(135deg,#FF7DB4,#C49BFF);color:#fff;padding:14px 16px calc(14px);border-radius:0 0 26px 26px;box-shadow:var(--shadow)}
.wohead .in{max-width:520px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.clock{font-family:'Fredoka';font-size:34px;font-weight:700;letter-spacing:1px;font-variant-numeric:tabular-nums}
.set{display:grid;grid-template-columns:26px 1fr 1fr 48px;gap:8px;align-items:center;margin-top:8px}
.set.t2{grid-template-columns:26px 1fr 48px}
.set .n{font-family:'Fredoka';font-weight:700;color:var(--ink-3);text-align:center}
.chk{width:48px;height:44px;border-radius:14px;background:#F3E8EE;font-size:20px;color:#fff}
.chk.on{background:var(--mint-d);box-shadow:0 3px 0 #1f7a57}
.set.done .stp{background:#EEFBF5;border-color:#BFEBD7}
.hint{margin-top:8px;padding:8px 12px;border-radius:12px;background:#FFF8E6;color:#8A6200;font-size:13px;font-weight:700}
.hint.up{background:#E9FBF2;color:var(--mint-d)}
.colh{display:grid;grid-template-columns:26px 1fr 1fr 48px;gap:8px;margin-top:10px}
.colh.t2{grid-template-columns:26px 1fr 48px}
.colh span{font-size:11px;font-weight:800;color:var(--ink-3);text-align:center;text-transform:uppercase}
.rest{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;border-radius:22px;padding:12px 14px 12px 18px;display:flex;align-items:center;gap:12px;z-index:40;box-shadow:0 10px 30px rgba(0,0,0,.25);font-weight:800;width:max-content;max-width:calc(100% - 32px)}
.rest .t{font-family:'Fredoka';font-size:24px;font-variant-numeric:tabular-nums}
.rest button{background:rgba(255,255,255,.15);border-radius:12px;padding:8px 10px;font-weight:800;font-size:13px}

/* roadmap */
.road{position:relative;padding-left:8px}
.step{display:flex;gap:14px;align-items:flex-start;position:relative;padding-bottom:16px}
.step:not(:last-child)::before{content:'';position:absolute;left:23px;top:48px;bottom:0;width:3px;background:repeating-linear-gradient(var(--line) 0 6px,transparent 6px 11px)}
.step.done:not(:last-child)::before{background:var(--pink)}
.bub{width:48px;height:48px;border-radius:50%;background:#F7EEF3;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;filter:grayscale(1);opacity:.55}
.step.done .bub{background:var(--pink-l);filter:none;opacity:1;border:3px solid var(--pink)}
.step.next .bub{background:#fff;filter:none;opacity:1;border:3px dashed var(--pink);animation:pulse 1.8s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.step .tt{font-weight:800;padding-top:4px}
.step.next .tt{color:var(--pink-d)}

/* badges */
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bdg{background:var(--pink-xl);border-radius:18px;padding:12px 6px;text-align:center}
.bdg .e{font-size:30px;display:block}
.bdg .l{font-size:12px;font-weight:800;margin-top:4px;line-height:1.2}
.bdg.off{background:#F6F2F4}
.bdg.off .e{filter:grayscale(1);opacity:.3}
.bdg.off .l{color:var(--ink-3)}

/* stats */
.stat{background:#fff;border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.stat .v{font-family:'Fredoka';font-size:26px;font-weight:700;color:var(--pink-d)}
.stat .k{font-size:12px;font-weight:800;color:var(--ink-3)}
svg text{font-family:'Nunito';font-weight:700}
select.sel{width:100%;padding:11px 12px;border-radius:14px;border:1.5px solid var(--line);background:#FFF6FA;font-weight:800}

/* photos */
.ph{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ph .p{position:relative;aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:#F6EAF0}
.ph img,.cmp img{width:100%;height:100%;object-fit:cover;display:block}
.ph .p span{position:absolute;left:6px;bottom:6px;background:rgba(255,255,255,.9);border-radius:8px;padding:2px 6px;font-size:11px;font-weight:800}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp .p{aspect-ratio:3/4;border-radius:16px;overflow:hidden;position:relative;background:#F6EAF0}
.cmp .p b{position:absolute;top:8px;left:8px;background:var(--pink);color:#fff;border-radius:10px;padding:3px 9px;font-size:12px}
.cmp .p small{position:absolute;bottom:8px;left:8px;background:rgba(255,255,255,.9);border-radius:8px;padding:2px 7px;font-size:11px;font-weight:800}

/* modal */
.ov{position:fixed;inset:0;background:rgba(58,36,64,.4);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:#fff;width:100%;max-width:540px;max-height:88vh;overflow:auto;border-radius:28px 28px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));animation:up .25s ease}
.sheet h2{font-size:22px;margin-bottom:8px}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
.field{width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:#FFF6FA;font-weight:700;font-size:16px;outline:none}
.field:focus{border-color:var(--pink)}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;border-radius:18px;border:2px solid var(--line);background:#fff;margin-top:10px}
.opt.on{border-color:var(--pink);background:var(--pink-xl)}
.seg{display:flex;background:#F8EEF3;border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;padding:9px 4px;border-radius:11px;font-weight:800;font-size:13px;color:var(--ink-2)}
.seg button.on{background:#fff;color:var(--pink-d);box-shadow:0 2px 6px rgba(0,0,0,.06)}
.toast{position:fixed;top:calc(16px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#fff;border-radius:18px;padding:12px 18px;box-shadow:0 10px 30px rgba(120,40,90,.25);font-weight:800;z-index:60;animation:up .3s;max-width:calc(100% - 32px);text-align:center}
.confetti{position:fixed;top:-40px;z-index:70;pointer-events:none;font-size:26px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.big-emo{font-size:64px;text-align:center;display:block;margin:6px 0}
.center{text-align:center}
.onb{min-height:100vh;display:flex;flex-direction:column;justify-content:center}
.hidden{display:none!important}
.pw{position:relative}.pw .field{padding-right:52px}.pw .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:20px;padding:8px}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:86%;padding:11px 14px;border-radius:20px;line-height:1.45;font-size:15px;word-wrap:break-word}
.msg.u{align-self:flex-end;background:var(--pink);color:#fff;border-bottom-right-radius:6px}
.msg.a{align-self:flex-start;background:#fff;box-shadow:var(--shadow);border-bottom-left-radius:6px}
.msg.a ul{margin:6px 0 2px 18px}.msg.a li{margin:2px 0}
.chatbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));width:calc(100% - 28px);max-width:490px;display:flex;gap:8px;z-index:19}
.chatbar .field{background:#fff;box-shadow:var(--shadow)}
.typing span{display:inline-block;animation:pulse 1s infinite}.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
nav.bottom button{font-size:11px}
.hint.err{background:#FFE8EE;color:#B4234F}
.btn:disabled{opacity:.6}
details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
</style>
</head>

// Mujeres que inspiran (la búsqueda abre sus vídeos en YouTube)

let pushT=null, pushing=false, pushAgain=false;
function schedulePush(){ if(!SB || !USER) return; clearTimeout(pushT); setSync('pending'); pushT=setTimeout(push, 1200); }
async function push(){
  if(!SB || !USER || !S) return;
  if(pushing){ pushAgain=true; return; }
  pushing=true; clearTimeout(pushT);
  const st=S, uid=USER.id, key=storeKey();
  try{
    const {workouts, _del, ...rest} = st;
    let r = await SB.from('user_state').upsert({user_id:uid, data:rest, updated_at:new Date(st._t||Date.now()).toISOString()});
    if(r.error) throw r.error;
    const un = st.workouts.filter(w=>!w._s);
    if(un.length){ r = await SB.from('workouts').upsert(un.map(w=>toRow(w,uid))); if(r.error) throw r.error; un.forEach(w=>w._s=true); }
    if(st._del.length){ const ids=[...st._del]; r = await SB.from('workouts').delete().eq('user_id',uid).in('id',ids); if(r.error) throw r.error; st._del = st._del.filter(i=>!ids.includes(i)); }
    writeLocal(st, key); if(st===S) setSync('ok');
  }catch(e){ console.warn('sync', e); if(st===S) setSync('error'); }
  pushing=false;
  if(pushAgain){ pushAgain=false; push(); }
}
async function pull(){
  const uid=USER.id;
  const [st, wo] = await Promise.all([
    SB.from('user_state').select('data,updated_at').eq('user_id',uid).maybeSingle(),
    SB.from('workouts').select('*').eq('user_id',uid).order('started_at')]);
  if(st.error || wo.error) throw (st.error || wo.error);
  if(st.data){
    const rt = Date.parse(st.data.updated_at) || 0;
    if(!S.profile || rt > (S._t||0)){ const keep={workouts:S.workouts, _del:S._del}; S = Object.assign(fresh(), st.data.data, keep); S._t = rt; }
  } else if(!S.profile){
    const L = legacy();   // datos de antes de tener cuenta → se suben a la nube
    if(L){ S = Object.assign(fresh(), L.s); S.workouts.forEach(w=>delete w._s); S._del=[]; localStorage.removeItem(L.k); }
  }
  const remote = (wo.data||[]).map(fromRow), rid = new Set(remote.map(w=>w.id));
  const localNew = S.workouts.filter(w=>!w._s && !rid.has(w.id));
  S.workouts = [...remote.filter(w=>!S._del.includes(w.id)), ...localNew].sort((a,b)=>a.start-b.start);
}

const num = v => { const n = parseFloat(String(v).replace(',','.')); return isNaN(n)?0:n; };
const fmtT = ms => { const s=Math.max(0,Math.floor(ms/1000)); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return (h?h+':':'')+String(m).padStart(h?2:1,'0')+':'+String(x).padStart(2,'0'); };
const fmtMin = ms => { const m=Math.round(ms/60000); return m<60? m+' min' : Math.floor(m/60)+' h '+(m%60)+' min'; };
const fmtD = t => new Date(t).toLocaleDateString('es-ES',{day:'numeric',month:'short'});
const dur = w => Math.max(0, w.end - w.start - (w.pausedMs||0));   // tiempo real entrenando (sin pausas)
const activeMs = A => Date.now() - A.start - (A.pausedMs||0) - (A.pausedAt ? Date.now()-A.pausedAt : 0);
const dayKey = t => { const d=new Date(t); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const parseDay = k => { const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d).getTime(); };
const startDay = t => { const d=new Date(t); d.setHours(0,0,0,0); return d.getTime(); };
function cyc(){ if(!S.cycle) S.cycle={on:false,asked:false,hormonal:false,len:28,plen:5,periods:[]}; return S.cycle; }
function cycleLen(){ const c=cyc(), ps=[...c.periods].sort(), g=[]; for(let i=1;i<ps.length;i++){ const d=Math.round((parseDay(ps[i])-parseDay(ps[i-1]))/864e5); if(d>=18&&d<=60) g.push(d); } const r=g.slice(-6); return r.length? Math.round(r.reduce((a,b)=>a+b,0)/r.length) : c.len; }
function cycleInfo(t=Date.now()){
  const c=cyc(); if(!c.on || c.hormonal || !c.periods.length) return null;
  const last=[...c.periods].sort().reverse().find(k=>parseDay(k)<=startDay(t)); if(!last) return null;
  const day=Math.round((startDay(t)-parseDay(last))/864e5)+1, len=cycleLen(), ov=len-14;
  const ph = day<=c.plen?'menstrual' : day<ov-1?'folicular' : day<=ov+1?'ovulatoria' : day<=len?'lutea' : 'tarde';
  return {day, len, ph, next:len-day+1};
}
const fmtH = t => new Date(t).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
const unit = k => k==='weight'?'kg':k==='time'?'s':'reps';
function weekStart(d){ d=new Date(d); d.setHours(0,0,0,0); d.setDate(d.getDate()-((d.getDay()+6)%7)); return d.getTime(); }
const weekKey = d => new Date(weekStart(d)).toISOString().slice(0,10);
const thisWeekW = () => S.workouts.filter(w=>w.start>=weekStart(Date.now()));
const doneSets = w => w.entries.reduce((a,e)=>a+e.sets.filter(s=>s.done).length,0);
const sumEx = (ws,id,f) => ws.reduce((a,w)=>a+w.entries.filter(e=>e.exId===id).reduce((b,e)=>b+e.sets.filter(s=>s.done).reduce((c,s)=>c+num(s[f]),0),0),0);
const volume = w => w.entries.reduce((a,e)=>ex(e.exId).kind==='weight'? a+e.sets.filter(s=>s.done).reduce((b,s)=>b+num(s.w)*num(s.r),0):a,0);
function level(xp){ let l=0, need=150, acc=0; while(xp>=acc+need){ acc+=need; l++; need=Math.round(need*1.35);} return {l, name:LEVELS[Math.min(l,LEVELS.length-1)]+(l>=LEVELS.length?' '+(l-LEVELS.length+2):''), cur:xp-acc, need}; }
function setMetric(kind,s){ return kind==='weight'? num(s.w) : kind==='time'? num(s.t) : num(s.r); }
function bestOf(exId, before){ let b=0; for(const w of S.workouts){ if(before && w.start>=before) continue; for(const e of w.entries) if(e.exId===exId) for(const s of e.sets) if(s.done && (ex(exId).kind!=='weight'||num(s.r)>0)) b=Math.max(b,setMetric(ex(exId).kind,s)); } return b; }
function lastEntry(exId){ for(let i=S.workouts.length-1;i>=0;i--){ const e=S.workouts[i].entries.find(e=>e.exId===exId && e.sets.some(s=>s.done)); if(e) return e; } return null; }
function addXP(n){ S.xp += n; }
function streak(){ // semanas seguidas con ≥ min(2, días plan) entrenos (la actual cuenta si ya se cumple)
  const need = Math.max(1, Math.min(2, (S.profile?.days||[]).length||2));
  let ws = weekStart(Date.now()), n=0, first=true;
  for(let i=0;i<200;i++){
    const c = S.workouts.filter(w=>w.start>=ws && w.start<ws+7*864e5).length;
    if(c>=need) n++; else if(!first) break;
    first=false; ws = weekStart(ws-864e5*3);
  }
  return n;
}

function curChallenge(){ const k=weekKey(Date.now()); return S.challenges[k]; }
function challengeOptions(){ const k=weekKey(Date.now()); let h=0; for(const c of k) h=(h*31+c.charCodeAt(0))>>>0; const pool=[...CHALLENGES]; const out=[]; while(out.length<3){ h=(h*1103515245+12345)>>>0; out.push(pool.splice(h%pool.length,1)[0]); } return out; }
function challengeProgress(c){ const def=CHALLENGES.find(x=>x.id===c.id); return {def, val:Math.min(def.goal, def.m(thisWeekW()))}; }
function checkChallenge(){ const c=curChallenge(); if(!c||c.done) return null; const p=challengeProgress(c); if(p.val>=p.def.goal){ c.done=Date.now(); addXP(120); return p.def; } return null; }
function sweep(silent){ const r=checkRoad(), c=checkChallenge(), b=checkBadges(); save(); r.forEach(x=>postActivity('road','',{id:x.id})); b.forEach(x=>postActivity('badge','',{id:x.id})); if(!silent){ const msgs=[...r.map(x=>x.e+' Camino: '+x.t), ...(c?['🎯 ¡Reto conseguido! '+c.t]:[]), ...b.map(x=>x.e+' Insignia: '+x.t)]; msgs.forEach((m,i)=>setTimeout(()=>toast(m),i*1400)); if(msgs.length) confetti(); } return {r,c,b}; }

function mdLite(t){
  const lines=esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').split('\n'); let out='', inList=false;
  for(const l of lines){ const m=l.match(/^\s*(?:[-•*]|\d+[.)])\s+(.*)/);
    if(m){ if(!inList){ out+='<ul>'; inList=true; } out+='<li>'+m[1]+'</li>'; }
    else { if(inList){ out+='</ul>'; inList=false; } out+= l.trim()? l+'<br>' : '<br>'; } }
  if(inList) out+='</ul>'; return out.replace(/(<br>)+$/,'');
}
function coachContext(){
  const d=new Date().getDay(), pl=S.plan[d], next=ROAD.find(r=>!S.road[r.id]), inf=cycleInfo(), last=S.workouts[S.workouts.length-1];
  const item=it=>{ const e=ex(it.exId); return `${e.name} (${it.sets}×${it.reps}${e.kind==='time'?' s':''})`; };
  const L=[`Nombre: ${S.profile.name}`, `Días de entreno: ${DAYS.filter(x=>S.profile.days.includes(x)).map(x=>DN[x]).join(', ')}`,
    pl&&pl.items.length?`Entreno de hoy (${pl.title}): ${pl.items.map(item).join('; ')}`:'Hoy no tiene entreno planificado',
    `Ejercicios en su biblioteca: ${S.exercises.slice(0,40).map(e=>e.name).join(', ')}`,
    `Camino a la dominada: ${ROAD.filter(r=>S.road[r.id]).length}/${ROAD.length} pasos. ${next?'Siguiente paso: '+next.t:'¡Ya hace dominadas!'}`,
    `Récords: colgarse ${bestOf('hang')} s, negativas ${bestOf('neg')} reps, dominadas ${bestOf('pull')}`,
    `Entrenos registrados: ${S.workouts.length}`];

async function coachSend(text){
  text=String(text||'').trim(); if(!text || ui.coachBusy) return;
  if(!SB||!USER){ toast('Conecta tu cuenta para usar el coach 💬'); return; }
  S.chat=(S.chat||[]); S.chat.push({role:'user',content:text,t:Date.now()}); S.chat=S.chat.slice(-40);
  ui.coachBusy=true; save(); render();
  let reply;
  try{
    const {data,error}=await SB.functions.invoke('coach',{body:{messages:S.chat.slice(-20).map(m=>({role:m.role,content:m.content})), context:coachContext()}});
    if(error){ let code=''; try{ code=(await error.context.json()).error; }catch(e){} throw new Error(code||error.message); }

    const m=String(e.message||e);

}

async function submitAuth(form){
  const a=ui.auth, f=new FormData(form), pw=String(f.get('password')||'');
  a.email=String(f.get('email')||'').trim(); if(f.has('name')) a.name=String(f.get('name')||'').trim();
  a.err=''; a.msg='';
  if(!/^\S+@\S+\.\S+$/.test(a.email)){ a.err='Revisa el email, parece que falta algo 💌'; return render(); }
  if(a.mode==='signup'){ if(!a.name){ a.err='¿Cómo te llamas? 💖'; return render(); } if(pw.length<8){ a.err='La contraseña necesita al menos 8 caracteres'; return render(); } }
  if(a.mode==='login' && !pw){ a.err='Escribe tu contraseña'; return render(); }
  a.busy=true; render();
  try{
    if(a.mode==='login'){
      const {error}=await SB.auth.signInWithPassword({email:a.email, password:pw}); if(error) throw error;
      a.busy=false;   // onAuthStateChange se encarga de entrar
    } else if(a.mode==='signup'){
      const {data,error}=await SB.auth.signUp({email:a.email, password:pw, options:{data:{name:a.name}, emailRedirectTo:appUrl()}}); if(error) throw error;
      a.busy=false;
      if(data.user && Array.isArray(data.user.identities) && data.user.identities.length===0) throw new Error('already registered');
      if(!data.session){ a.mode='login'; a.msg='💌 ¡Cuenta creada! Te hemos enviado un email: ábrelo para confirmarla y después entra aquí.'; render(); }
    } else {
      const {error}=await SB.auth.resetPasswordForEmail(a.email, {redirectTo:appUrl()}); if(error) throw error;
      a.busy=false; a.msg='💌 Si ese email tiene cuenta, te llegará un enlace (mira también en spam).'; render();
    }
  }catch(e){ a.busy=false; a.err=authErr(e); render(); }
}

function weeksChart(){
  const N=8, ws=weekStart(Date.now()), data=[];
  for(let i=N-1;i>=0;i--){ const st=ws-i*7*864e5; data.push({l:fmtD(st), v:S.workouts.filter(w=>w.start>=st&&w.start<st+7*864e5).length}); }
  const max=Math.max(3,...data.map(d=>d.v)), W=320, H=140, bw=W/N;
  return `<svg viewBox="0 0 ${W} ${H+24}" width="100%" role="img" aria-label="Entrenos por semana">${data.map((d,i)=>{const h=d.v/max*H; return `<rect x="${i*bw+8}" y="${H-h}" width="${bw-16}" height="${Math.max(h,3)}" rx="8" fill="${i===N-1?'#FF5FA2':'#E7CCFF'}"/>${d.v?`<text x="${i*bw+bw/2}" y="${H-h-6}" text-anchor="middle" font-size="12" fill="#6E5577">${d.v}</text>`:''}<text x="${i*bw+bw/2}" y="${H+16}" text-anchor="middle" font-size="9.5" fill="#A891AE">${d.l}</text>`}).join('')}</svg>`;
}
function exChart(id){
  const k=ex(id).kind, pts=[];
  for(const w of S.workouts){ let b=0; for(const e of w.entries) if(e.exId===id) for(const s of e.sets) if(s.done) b=Math.max(b,setMetric(k,s)); if(b) pts.push({t:w.start,v:b}); }
  if(!pts.length) return '';
  const best=Math.max(...pts.map(p=>p.v)), first=pts[0].v, lab=k==='weight'?'Mejor peso (kg)':k==='time'?'Mejor tiempo (s)':'Mejores repeticiones';
  const W=320,H=150,P=24, mn=Math.min(...pts.map(p=>p.v))*.9, mx=best*1.05||1;
  const x=i=>pts.length===1?W/2:P+i*(W-2*P)/(pts.length-1), y=v=>H-P-(v-mn)/(mx-mn||1)*(H-2*P);
  const path=pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p.v).toFixed(1)).join(' ');
  return `<div class="row mt" style="gap:8px;flex-wrap:wrap"><span class="pill pk">🏆 Récord: ${best} ${unit(k)}</span>${pts.length>1?`<span class="pill mn">${best-first>=0?'+':''}${+(best-first).toFixed(1)} ${unit(k)} desde el inicio</span>`:''}</div>
  <svg viewBox="0 0 ${W} ${H}" width="100%" class="mt" role="img" aria-label="${lab}">
   <defs><linearGradient id="g" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#FF5FA2" stop-opacity=".25"/><stop offset="1" stop-color="#FF5FA2" stop-opacity="0"/></linearGradient></defs>
   ${pts.length>1?`<path d="${path} L ${x(pts.length-1)} ${H-P} L ${x(0)} ${H-P} Z" fill="url(#g)"/>`:''}
   <path d="${path}" fill="none" stroke="#FF5FA2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
   ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="${p.v===best?6:4}" fill="${p.v===best?'#FFC94D':'#fff'}" stroke="#FF5FA2" stroke-width="2.5"/>`).join('')}
   <text x="${P}" y="${H-4}" font-size="10" fill="#A891AE">${fmtD(pts[0].t)}</text><text x="${W-P}" y="${H-4}" font-size="10" text-anchor="end" fill="#A891AE">${fmtD(pts[pts.length-1].t)}</text>
  </svg><div class="tiny center">${lab}</div>`;
}

const stp=(e,s,f,v,d)=>`<div class="stp"><button data-a="adj" data-e="${e}" data-s="${s}" data-f="${f}" data-v="${-d}">−</button><input inputmode="decimal" data-in="set" data-e="${e}" data-s="${s}" data-f="${f}" value="${esc(v)}"><button data-a="adj" data-e="${e}" data-s="${s}" data-f="${f}" data-v="${d}">+</button></div>`;
const stpT=(e,s,v)=>{ const on=ui.holdT&&ui.holdT.e===e&&ui.holdT.s===s; return `<div class="stp"><button data-a="hold" data-e="${e}" data-s="${s}" style="width:auto;padding:0 10px;font-size:15px;${on?'color:#fff;background:var(--pink)':''}">${on?'⏹ parar':'⏱'}</button><input inputmode="numeric" id="${on?'holdIn':''}" data-in="set" data-e="${e}" data-s="${s}" data-f="t" value="${esc(v)}"><button data-a="adj" data-e="${e}" data-s="${s}" data-f="t" data-v="5">+</button></div>`; };

function makeEntry(exId, sets, target, soft){
  const e=ex(exId), last=lastEntry(exId); let hint='', up=false, w=0, r=target, t=target;
  if(last && soft){ const ds=last.sets.filter(s=>s.done); w=Math.max(0,...ds.map(s=>num(s.w))); hint='🌸 Modo suave: '+(e.kind==='weight'&&w?`mismo peso que la última vez (${w} kg)`:'lo mismo que la última vez')+', sin presión'; }
  else if(last){
    const ds=last.sets.filter(s=>s.done), lw=Math.max(...ds.map(s=>num(s.w)));
    const hit=ds.length>=Math.min(sets,last.sets.length) && ds.every(s=>e.kind==='time'?num(s.t)>=target:num(s.r)>=target);
    if(e.kind==='weight'){ w=lw; if(hit&&lw>0){ w=lw+2.5; up=true; hint=`⬆️ ¡La última vez lo clavaste! Prueba ${w} kg (antes ${lw} kg)`; } else hint=`💡 La última vez: ${ds.map(s=>`${num(s.w)}kg×${num(s.r)}`).join(' · ')}`; }
    else if(e.kind==='time'){ const lt=Math.max(...ds.map(s=>num(s.t))); if(hit){ t=Math.max(target,lt)+5; up=true; hint=`⬆️ ¡Sube a ${t} s! (récord ${bestOf(exId)} s)`; } else hint=`💡 La última vez: ${ds.map(s=>num(s.t)+'s').join(' · ')}`; }
    else { const lr=Math.max(...ds.map(s=>num(s.r))); if(hit){ r=Math.max(target,lr)+1; up=true; hint=`⬆️ ¡Prueba ${r} repeticiones!`; } else hint=`💡 La última vez: ${ds.map(s=>num(s.r)).join(' · ')} reps`; }
  }
  return {exId, target, hint, up, sets:Array.from({length:sets},()=>({w:e.kind==='weight'?w:'', r:e.kind==='time'?'':r, t:e.kind==='time'?t:'', done:false}))};
}
function startWorkout(day, o={}){
  const pl=S.plan[day]||{title:'Entreno libre ✨',items:[]}, ci=cycleInfo();
  let items=pl.items.map(it=>({...it}));
  if(o.mini){ items=(items.length?items:[{exId:'hang',sets:1,reps:20},{exId:'scap',sets:1,reps:8}]).slice(0,2).map(it=>({...it,sets:1})); }
  else if(o.soft){ items=items.map(it=>({...it, sets:Math.max(1,it.sets-1)})); }
  S.active={start:Date.now(), day:+day, title:pl.title+(o.mini?' · 5 min 🌱':o.soft?' · suave 🌸':''), entries:items.map(it=>makeEntry(it.exId,it.sets,it.reps,o.soft||o.mini)),
    meta:{energy:o.energy||null, symptoms:o.symptoms||[], soft:!!(o.soft||o.mini), mini:!!o.mini, cycleDay:ci?ci.day:null, phase:ci?ci.ph:null}};
  if(o.mini) setTimeout(()=>toast('🌱 Solo 5 minutos. Si luego quieres parar, paras. ¡Trato hecho!'),400);
  save(); closeModal(); render(); scrollTo(0,0); buzz(30);
}
function finishWorkout(){
  const A=S.active; stopHold(); stopRest();
  if(A.pausedAt){ A.pausedMs=(A.pausedMs||0)+(Date.now()-A.pausedAt); A.pausedAt=null; }
  const end=Date.now();
  const w={id:uid(), start:A.start, end, pausedMs:A.pausedMs||0, meta:A.meta||{}, title:A.title, day:A.day, entries:A.entries.map(e=>({exId:e.exId,target:e.target,sets:e.sets.map(s=>({w:s.w,r:s.r,t:s.t,done:s.done}))}))};
  const sets=doneSets(w);
  if(!sets){ if(!confirm('No has marcado ninguna serie ✓. ¿Terminar sin guardar?')) return; S.active=null; save(); render(); return; }
  w.prs=[]; for(const e of w.entries){ const k=ex(e.exId).kind, prev=bestOf(e.exId), b=Math.max(0,...e.sets.filter(s=>s.done&&(k!=='weight'||num(s.r)>0)).map(s=>setMetric(k,s))); if(b>prev && prev>0) w.prs.push({exId:e.exId,v:b}); }
  const xp=sets*10+50+w.prs.length*30; w.xp=xp; addXP(xp);
  const L0=level(S.xp-xp).l;
  S.workouts.push(w); S.active=null;
  postActivity('workout','',{title:A.title.replace(/ · (5 min 🌱|suave 🌸)$/,''), min:Math.round(dur(w)/60000), sets, prs:w.prs.length});
  const res=sweep(true), L1=level(S.xp);
  const items=[
    ...w.prs.map(p=>`🏆 Récord en ${esc(ex(p.exId).name)}: <b>${p.v} ${unit(ex(p.exId).kind)}</b>`),
    ...res.r.map(r=>`${r.e} Camino: <b>${r.t}</b>`), ...(res.c?[`🎯 Reto: <b>${res.c.t}</b>`]:[]),
    ...res.b.map(b=>`${b.e} Insignia: <b>${b.t}</b>`), ...(L1.l>L0?[`🆙 ¡Subes a nivel ${L1.l+1}: <b>${L1.name}</b>!`]:[])];

let tickI=null;
function tick(){ clearInterval(tickI); tickI=setInterval(()=>{ if(!S.active){clearInterval(tickI);return;} const c=$('#clock'); if(c) c.textContent=fmtT(activeMs(S.active)); const pc=$('#pauseClock'); if(pc&&S.active.pausedAt) pc.textContent=fmtT(Date.now()-S.active.pausedAt); if(ui.holdT){ const h=$('#holdIn'); if(h) h.value=Math.floor((Date.now()-ui.holdT.t0)/1000); } },250); }
let restI=null;
function startRest(){ ui.restEnd=Date.now()+S.restSec*1000; clearInterval(restI); drawRest(); restI=setInterval(drawRest,250); }
function stopRest(){ clearInterval(restI); ui.restEnd=0; $('#rest').innerHTML=''; }
function drawRest(){ const left=ui.restEnd-Date.now(); if(left<=0){ stopRest(); buzz([200,100,200]); toast('💪 ¡A por la siguiente serie!'); return; } $('#rest').innerHTML=`<div class="rest"><span>💤 Descanso</span><span class="t">${fmtT(left)}</span><button data-a="restAdd">+15s</button><button data-a="restSkip">Saltar</button></div>`; }
function stopHold(){ if(!ui.holdT) return; const {e,s,t0}=ui.holdT; if(S.active) S.active.entries[e].sets[s].t=Math.floor((Date.now()-t0)/1000); ui.holdT=null; save(); }

/* ---------- fotos (IndexedDB) ---------- */
let photoCount=0, photoCache=null;
function db(){ return new Promise((res,rej)=>{ const r=indexedDB.open('glowfit',1); r.onupgradeneeded=()=>r.result.createObjectStore('photos',{keyPath:'id'}); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function allPhotos(){
  if(USER){ try{
    if(photoCache && photoCache.exp>Date.now()) return photoCache.list;
    const r=await SB.from('photos').select('id,taken_at,path').eq('user_id',USER.id).order('taken_at'); if(r.error) throw r.error;
    let list=[]; if(r.data.length){ const u=await SB.storage.from('photos').createSignedUrls(r.data.map(p=>p.path), 3600); if(u.error) throw u.error;
      list=r.data.map((p,i)=>({id:p.id, date:Date.parse(p.taken_at), path:p.path, data:(u.data[i]||{}).signedUrl||''})); }
    photoCache={list, exp:Date.now()+50*60000}; return list;
  }catch(e){ console.warn('photos', e); return []; } }
  try{ const d=await db(); return await new Promise(res=>{ const q=d.transaction('photos').objectStore('photos').getAll(); q.onsuccess=()=>res(q.result.sort((a,b)=>a.date-b.date)); q.onerror=()=>res([]); }); }catch(e){ return []; } }
async function putPhoto(p){
  if(USER){ const blob=await (await fetch(p.data)).blob(), path=`${USER.id}/${p.id}.jpg`;
    let r=await SB.storage.from('photos').upload(path, blob, {contentType:'image/jpeg'}); if(r.error) throw r.error;
    r=await SB.from('photos').insert({id:p.id, user_id:USER.id, taken_at:new Date(p.date).toISOString(), path}); if(r.error) throw r.error;
    photoCache=null; return; }
  const d=await db(); return new Promise((res,rej)=>{ const t=d.transaction('photos','readwrite'); t.objectStore('photos').put(p); t.oncomplete=res; t.onerror=()=>rej(t.error); }); }
async function delPhoto(id){
  if(USER){ const p=(await allPhotos()).find(x=>x.id===id); if(p) await SB.storage.from('photos').remove([p.path]); await SB.from('photos').delete().eq('user_id',USER.id).eq('id',id); photoCache=null; return; }
  const d=await db(); return new Promise(res=>{ const t=d.transaction('photos','readwrite'); t.objectStore('photos').delete(id); t.oncomplete=res; }); }
async function refreshPhotoStats(){ const ps=await allPhotos(); photoCount=ps.length; const ws=weekStart(Date.now()); photosThisWeek=ps.filter(p=>p.date>=ws).length; }
async function loadPhotos(){
  const ps=await allPhotos(); const el=$('#photos'); if(!el) return;
  if(!ps.length){ el.innerHTML=`<div class="card soft center" style="margin:0"><span style="font-size:34px">🪞</span><p class="muted">Hazte una foto hoy: será tu "antes". ¡En unas semanas vas a flipar!</p></div>`; return; }
  const a=ps[0], b=ps[ps.length-1];
  el.innerHTML=(ps.length>1?`<div class="cmp"><div class="p"><img src="${a.data}" alt="Antes"><b>Antes</b><small>${fmtD(a.date)}</small></div><div class="p"><img src="${b.data}" alt="Ahora"><b>Ahora</b><small>${fmtD(b.date)}</small></div></div><p class="tiny center mt">${Math.round((b.date-a.date)/864e5)} días de diferencia 💖</p>`:'')+
    `<div class="ph mt">${[...ps].reverse().map(p=>`<div class="p" data-a="photo" data-v="${p.id}"><img src="${p.data}" alt="Foto ${fmtD(p.date)}" loading="lazy"><span>${fmtD(p.date)}</span></div>`).join('')}</div>`;
}
function pickPhoto(){
  const i=document.createElement('input'); i.type='file'; i.accept='image/*';
  i.onchange=()=>{ const f=i.files[0]; if(!f) return; const img=new Image(); const url=URL.createObjectURL(f);
    img.onload=async()=>{ const M=1080, sc=Math.min(1,M/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=img.width*sc; c.height=img.height*sc; c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
      toast('📸 Guardando…'); try{ await putPhoto({id:uid(), date:Date.now(), data:c.toDataURL('image/jpeg',.82)}); await refreshPhotoStats(); addXP(20); toast('📸 ¡Foto guardada! +20 XP'); sweep(); render(); }catch(e){ toast('⚠️ No se pudo guardar la foto'); } };
    img.src=url; };
  i.click();
}

  restSec:el=>{ S.restSec=+el.dataset.v; save(); render(); },
  rename:()=>{ const n=prompt('¿Cómo te llamo?', S.profile.name); if(n&&n.trim()){ S.profile.name=n.trim(); save(); render(); } },
  export:()=>{ const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='girlgym-copia-'+new Date().toISOString().slice(0,10)+'.json'; a.click(); toast('💾 Copia descargada (las fotos se quedan en el móvil)'); },
  import:()=>{ const i=document.createElement('input'); i.type='file'; i.accept='.json,application/json'; i.onchange=async()=>{ try{ const d=JSON.parse(await i.files[0].text()); if(!d.v||!d.profile) throw 0; if(!confirm('Esto reemplaza tus datos actuales. ¿Seguir?')) return; const old=S.workouts.filter(w=>w._s).map(w=>w.id); S=Object.assign(fresh(),d); S.workouts.forEach(w=>delete w._s); S._del=old.filter(id=>!S.workouts.some(w=>w.id===id)); save(); render(); toast('📥 ¡Datos restaurados!'); }catch(e){ toast('⚠️ Ese archivo no es una copia de GirlGym'); } }; i.click(); },
  reset:()=>{ if(confirm('¿Seguro? Se borran tus entrenos y tu progreso (las fotos se quedan).') && confirm('¿Segurísima? 🥺')){ const ids=S.workouts.filter(w=>w._s).map(w=>w.id); S=fresh(); S._del=ids; ui.onb=0; if(USER&&USER.user_metadata&&USER.user_metadata.name){ ui.onbData.name=USER.user_metadata.name; ui.onb=1; } save(); render(); } },
  // workout
  adj:el=>{ const s=S.active.entries[+el.dataset.e].sets[+el.dataset.s], f=el.dataset.f; s[f]=Math.max(0, +(num(s[f])+ +el.dataset.v).toFixed(2)); save(); render(); },
  tick:el=>{ const ei=+el.dataset.e, si=+el.dataset.s; if(ui.holdT&&ui.holdT.e===ei&&ui.holdT.s===si) stopHold(); const s=S.active.entries[ei].sets[si]; s.done=!s.done; save(); render(); if(s.done){ buzz(40); toast('+10 XP ✨'); const all=S.active.entries.every(e=>e.sets.every(x=>x.done)); if(all){ stopRest(); toast('🎉 ¡Todo hecho! Pulsa Terminar'); } else startRest(); } },
  addSet:el=>{ const en=S.active.entries[+el.dataset.e], l=en.sets[en.sets.length-1]; en.sets.push({...l,done:false}); save(); render(); },
  delSet:el=>{ const en=S.active.entries[+el.dataset.e]; en.sets.pop(); save(); render(); },
  woDelEx:el=>{ if(confirm('¿Quitar este ejercicio del entreno de hoy?')){ S.active.entries.splice(+el.dataset.e,1); ui.holdT=null; save(); render(); } },
  hold:el=>{ const e=+el.dataset.e, s=+el.dataset.s; if(ui.holdT&&ui.holdT.e===e&&ui.holdT.s===s){ stopHold(); buzz(80); render(); return; } stopHold(); stopRest(); ui.holdT={e,s,t0:Date.now()}; buzz(30); render(); },
  restAdd:()=>{ ui.restEnd+=15000; drawRest(); },
  restSkip:()=>stopRest(),
  finish:()=>finishWorkout(),
  pause:()=>{ const A=S.active; if(A.pausedAt) return; stopHold(); stopRest(); A.pausedAt=Date.now(); save(); render(); buzz(40); },
  resume:()=>{ const A=S.active; if(!A.pausedAt) return; A.pausedMs=(A.pausedMs||0)+(Date.now()-A.pausedAt); A.pausedAt=null; save(); render(); buzz(30); toast('💪 ¡Seguimos!'); },
  cancelWo:()=>{ if(confirm('¿Cancelar el entreno? No se guardará.')){ S.active=null; ui.holdT=null; stopRest(); save(); render(); } },
  delW:el=>{ if(confirm('¿Borrar este entreno del historial?')){ const w=S.workouts.find(w=>w.id===el.dataset.v); if(w&&w._s) S._del.push(w.id); S.workouts=S.workouts.filter(w=>w.id!==el.dataset.v); save(); render(); } },
  addPhoto:()=>pickPhoto(),
  photo:async el=>{ const p=(await allPhotos()).find(x=>x.id===el.dataset.v); if(!p) return; modal(`<img src="${p.data}" alt="" style="width:100%;border-radius:18px"><p class="center name mt">${new Date(p.date).toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'})}</p><button class="btn ghost mt" data-a="delPhoto" data-v="${p.id}">🗑️ Borrar foto</button>`); },
  delPhoto:async el=>{ if(!confirm('¿Borrar esta foto?')) return; await delPhoto(el.dataset.v); await refreshPhotoStats(); closeModal(); render(); },
  close:()=>closeModal(),
  ovClose:(el,e)=>{ if(e.target===el) closeModal(); },
};

document.addEventListener('click', e=>{
  const el=e.target.closest('[data-a]'); if(!el) return;
  const f=A[el.dataset.a]; if(f){ if(el.dataset.a!=='ovClose') e.stopPropagation(); f(el,e); }
});
document.addEventListener('input', e=>{
  const el=e.target; if(!el.dataset || !el.dataset.in) return;
  if(el.dataset.in==='set'){ const s=S.active.entries[+el.dataset.e].sets[+el.dataset.s]; s[el.dataset.f]=el.value; if(el.dataset.f==='t'&&ui.holdT&&ui.holdT.e===+el.dataset.e&&ui.holdT.s===+el.dataset.s) ui.holdT=null; save(); }
  if(el.dataset.in==='libQ'){ ui.libQ=el.value; const pos=el.selectionStart; const t=$('.sheet [data-a="newEx"]')?.dataset.v||''; libraryModal(t); const n=$('#libQ'); n.focus(); n.setSelectionRange(pos,pos); }
});
document.addEventListener('submit', async e=>{
  if(e.target.id==='authForm'){ e.preventDefault(); submitAuth(e.target); }
  if(e.target.id==='friendForm'){ e.preventDefault(); const code=String(new FormData(e.target).get('c')||'').trim().toUpperCase();
    if(!/^[A-Z0-9]{6}$/.test(code)){ toast('El código tiene 6 letras o números'); return; }
    const r=await SB.rpc('find_friend_code',{p_code:code}); const f=r.data&&r.data[0];
    if(!f){ toast('🙈 No encuentro ese código'); return; }
    if(ui.soc.friends.some(x=>x.id===f.user_id)){ toast(`Ya estás conectada con ${f.name} 💖`); closeModal(); return; }
    const ins=await SB.from('friendships').insert({id:uuid(), requester:USER.id, addressee:f.user_id, status:'pending'});
    if(ins.error){ toast('⚠️ No se pudo enviar'); return; }
    closeModal(); toast(`💌 Solicitud enviada a ${f.name}`); loadSocial(); }
  if(e.target.id==='cheerForm'){ e.preventDefault(); sendCheer(e.target.dataset.to, new FormData(e.target).get('t')); }
  if(e.target.id==='answerForm'){ e.preventDefault(); const t=String(new FormData(e.target).get('t')||'').trim(); if(!t) return;
    await postActivity('answer', t.slice(0,300), {q:weekIdx()%QUESTIONS.length}); addXP(10); save(); toast('💬 ¡Respuesta compartida! +10 XP'); loadSocial(); }
  if(e.target.dataset && e.target.dataset.reply){ e.preventDefault(); const id=e.target.dataset.reply, t=String(new FormData(e.target).get('t')||'').trim(); if(!t) return;
    const row={id:uuid(), post_id:id, user_id:USER.id, text:t.slice(0,300), created_at:new Date().toISOString()};
    const r=await SB.from('post_replies').insert({id:row.id, post_id:id, user_id:USER.id, text:row.text}); if(r.error){ toast('⚠️ No se pudo enviar'); return; }
    ui.soc.replies.push(row); render(); }
  if(e.target.id==='coachForm'){ e.preventDefault(); const i=$('#coachIn'); const v=i.value; i.value=''; coachSend(v); }
  if(e.target.id==='pwForm'){ e.preventDefault(); const pw=String(new FormData(e.target).get('password')||'');
    if(pw.length<8){ toast('Mínimo 8 caracteres 🔑'); return; }
    const {error}=await SB.auth.updateUser({password:pw}); if(error){ toast(authErr(error)); return; }
    closeModal(); toast('🔑 ¡Contraseña cambiada!'); }
});
document.addEventListener('change', e=>{ if(e.target.dataset.in==='chartEx'){ ui.chartEx=e.target.value; render(); } });
document.addEventListener('keydown', e=>{ if(e.key==='Enter' && e.target.id==='onbName') A.onbNext(); });

/* ---------- arranque ---------- */
function boot(){
  if(CLOUD){
    SB.auth.onAuthStateChange((ev, session)=>{
      setTimeout(()=>{   // fuera del callback (recomendado por Supabase)
        if(ev==='PASSWORD_RECOVERY') newPasswordModal();
        if(session && session.user && (ev==='INITIAL_SESSION' || ev==='SIGNED_IN')) onLogin(session.user);
        else if(ev==='INITIAL_SESSION'){ ui.booting=false; render(); }
        if(ev==='SIGNED_OUT' && USER) onLogout();
      }, 0);
    });
    setTimeout(()=>{ if(ui.booting && !USER){ ui.booting=false; render(); } }, 8000);
  } else {
    let local=false; try{ local=localStorage.getItem('glowfit-localmode')==='1'; }catch(e){}
    if(local) enterLocal(); else { ui.booting=false; }
  }
  render();
}
window.addEventListener('online', ()=>schedulePush());
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') push(); else if(USER && S && S.profile && Date.now()-(ui.socAt||0)>60000) loadSocial(); });
boot();
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
